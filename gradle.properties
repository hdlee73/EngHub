org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Edge text-to-speech client token, a credential. Leave it empty in the repository and set the real value in
# ~/.gradle/gradle.properties (or the EDGE_TTS_TOKEN environment variable / a CI secret). Never commit a real token.
edgeTtsToken=

# Release signing. Leave these empty in the repository and set real values in ~/.gradle/gradle.properties or as
# environment variables (CI secrets). Without them the release build is unsigned and only debug builds work.
engHubKeystorePath=
engHubStorePassword=
engHubKeyAlias=
engHubKeyPassword=
