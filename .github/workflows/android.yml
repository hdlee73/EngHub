name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6

      - name: Test the dictionary data tools
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Build the offline dictionary and example data
        run: python tools/build_learning_data.py

      - name: Use the repository signing key (or the optional secret)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ENGLISH_STUDY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/english-study.keystore"
            echo "ENGLISH_STUDY_KEYSTORE_PATH=$RUNNER_TEMP/english-study.keystore" >> "$GITHUB_ENV"
            echo "Using the signing key from the ENGLISH_STUDY_KEYSTORE_BASE64 secret."
          else
            echo "Using signing/english-study.keystore from the repository."
          fi

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-build-cache 2>&1 | tee gradle.log || status=$?
          if [ "${status:-0}" != "0" ]; then
            # Surface the compiler / test errors as annotations so they are readable without opening the raw log.
            grep -E "^e: |FAILED|AssertionError|What went wrong" -A2 gradle.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$status"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: EnglishStudy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          tag="v${version}"
          apk="EnglishStudy-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "LexiFlow $tag" --notes-file RELEASE_NOTES.md
          fi
